name: test

# Reusable workflow holding the actual install+test steps. Never triggered directly --
# called once per Python version by py310.yml/py311.yml/py312.yml/py313.yml so each version
# gets its own workflow run (and therefore its own README badge; GitHub's badge.svg is
# per-workflow, so a single matrix job can't produce independent per-version badges).
on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # setuptools_scm needs tags to resolve uspy/version.py

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - run: python -m pip install --upgrade pip setuptools wheel

      - run: pip install -e ".[test]"

      - run: pytest tests/ -v --durations=10
